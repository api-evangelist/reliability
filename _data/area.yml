meta:
  name: Reliability
  description: An index and topic collection covering site reliability engineering
    (SRE), reliability platforms, service level objectives (SLOs), error budgets,
    chaos engineering, resilience testing, and incident response. Reliability platforms
    help teams define and measure reliability targets, intentionally inject failure
    to validate resilience, manage on-call rotations and alerting, coordinate incident
    response, and run blameless post-incident reviews. This collection includes SLO
    management platforms like Nobl9 and Chronosphere, chaos engineering tools like
    Gremlin, Chaos Mesh, Litmus, and AWS Fault Injection Simulator, internal developer
    platforms with reliability scoring like OpsLevel and Cortex, and incident response
    platforms like PagerDuty, OpsGenie, Incident.io, FireHydrant, Rootly, Blameless,
    Squadcast, and Zenduty.
  tags:
  - SRE
  - Reliability
  - SLO
  - Chaos Engineering
  - Incident Response
  - Error Budget
  - On-Call
  - Resilience
  portal: https://apievangelist.com
  github: https://github.com/api-evangelist
  repo: reliability
